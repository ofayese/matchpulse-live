[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchpulse-live"
version = "0.1.0"
description = "Real-time, multilingual and personalized football intelligence from synthetic events"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "Pillow>=13,<14",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "websockets>=13,<16",
]
azure = [
  "azure-identity>=1.19,<2",
]
narration = [
  "elevenlabs>=2.74,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
matchpulse = "matchpulse.__main__:main"
matchpulse-synthetic = "matchpulse.synthetic:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042 would replace `class X(str, Enum)` with `enum.StrEnum`, which changes
# `str()` output for enum members. The pydantic models in this package rely on
# the current `str, Enum` behaviour, so the rule is intentionally not applied.
ignore = ["E501", "UP042"]
