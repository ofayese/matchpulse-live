name: publish-container

# Publication is a separate gate from the independent audit. This workflow
# publishes exactly one immutable, commit-scoped tag and nothing else.
#
# It never publishes latest, main, stable or a tag that does not match the
# audited commit. It uses the repository GITHUB_TOKEN, which GitHub recommends
# for registry workflows associated with the repository, so no long-lived
# registry credential is ever stored on this machine or in a secret store.
#
# The workflow requires the caller to pass the full commit SHA that was
# independently audited. The checkout is verified against that SHA before any
# image is built.
#
# The order of operations is fixed and fail-closed:
#   1. build the image locally, without pushing it;
#   2. scan that exact image and block on any HIGH or CRITICAL finding;
#   3. only then log in and push the scanned image.
# The scan is never skipped, never reordered after the push, and never made
# non-blocking. There is no ignore file, no ignore-unfixed mode, no blanket
# CVE exception and no severity downgrade.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full 40 character SHA of the independently audited commit to publish'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ inputs.commit_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CANDIDATE_TAG: matchpulse-live:publish-candidate
  TRIVY_VERSION: 0.76.0

jobs:
  publish:
    name: Publish immutable image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify the requested commit
        env:
          REQUESTED: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ "${#REQUESTED}" -ne 40 ]; then
            echo "The commit SHA must be the full 40 character SHA." >&2
            exit 1
          fi
          case "$REQUESTED" in
            *[!0-9a-f]*) echo "The commit SHA must be lowercase hexadecimal." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify the checkout matches the audited commit
        env:
          REQUESTED: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$REQUESTED" ]; then
            echo "Checkout $ACTUAL does not match the requested commit $REQUESTED." >&2
            exit 1
          fi
          echo "Publishing audited commit $ACTUAL"

      - uses: docker/setup-buildx-action@v3

      - name: Build the candidate image without pushing it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.CANDIDATE_TAG }}

      - name: Block on HIGH or CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            "${CANDIDATE_TAG}"

      - name: Log in to GHCR with the repository GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the audited image as an immutable commit-scoped tag
        id: push
        env:
          TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          docker tag "${CANDIDATE_TAG}" "${TAG}"
          docker push "${TAG}" | tee /tmp/push.log
          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/push.log | tail -n 1)"
          if [ -z "${DIGEST}" ]; then
            echo "The push did not report a registry digest." >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published immutable image"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Reference: \`${TAG%@*}\@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Request public visibility for the package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # A package published from a public repository with GITHUB_TOKEN
          # inherits the repository visibility. The request below is a best
          # effort confirmation and must never fail the publication.
          curl -sS -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/user/packages/container/${PACKAGE}/visibility" \
            -d '{"visibility":"public"}' || true

      - name: Verify the published reference anonymously
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --raw > /dev/null
          echo "Immutable digest ${DIGEST} is resolvable."
