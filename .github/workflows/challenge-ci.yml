name: challenge-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: challenge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Byte-compile sources
        run: python -m compileall src

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Tests
        run: python -m pytest -q

      - name: Coverage (minimum 80%)
        run: python -m pytest --cov=matchpulse --cov-report=term-missing --cov-fail-under=80

      - name: Preflight
        run: python scripts/preflight.py

      - name: Visual Studio solution validation
        run: python scripts/validate_solution.py

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t matchpulse-live:ci .

      - name: Inspect image
        run: |
          docker image inspect matchpulse-live:ci --format '{{.Config.User}} {{json .Config.Healthcheck}}'
          test "$(docker image inspect matchpulse-live:ci --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect matchpulse-live:ci --format '{{.Config.User}}')" != "root"

      # Fail-closed vulnerability gate. Any HIGH or CRITICAL finding fails the
      # build. The gate is never skipped, reordered after a push, or made
      # non-blocking, and it uses no ignore file, no ignore-unfixed mode, no
      # blanket CVE exception and no severity downgrade.
      - name: Block on HIGH or CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            "aquasec/trivy:0.76.0" image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            matchpulse-live:ci

      - name: Compose configuration
        run: docker compose -f compose.challenge.yml config
  attest-release:
    name: Attest release image binding
    runs-on: ubuntu-latest
    needs: [container]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 68409d3b82159164c7efb5172213cc3ce55cbe70

      - name: Generate release binding predicate
        run: |
          set -euo pipefail
          jq -nS \
            --arg image "ghcr.io/ofayese/matchpulse-live@sha256:90ce4db3a1d61b62aa12c4009def817643f8378bf7c49c15a2f771af469b5268" \
            --arg releaseCommit "68409d3b82159164c7efb5172213cc3ce55cbe70" \
            --arg repository "https://github.com/ofayese/matchpulse-live" \
            '{image: $image, releaseCommit: $releaseCommit, repository: $repository, schemaVersion: 1}' > predicate.json
          jq -e . predicate.json >/dev/null

      - name: Create custom in-toto attestation
        uses: actions/attest@v1
        with:
          subject-name: ghcr.io/ofayese/matchpulse-live
          subject-digest: sha256:90ce4db3a1d61b62aa12c4009def817643f8378bf7c49c15a2f771af469b5268
          predicate-type: https://github.com/ofayese/matchpulse-live/attestations/release-binding/v1
          predicate-path: predicate.json