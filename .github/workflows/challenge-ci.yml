name: challenge-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: challenge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Byte-compile sources
        run: python -m compileall src

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Tests
        run: python -m pytest -q

      - name: Coverage (minimum 80%)
        run: python -m pytest --cov=matchpulse --cov-report=term-missing --cov-fail-under=80

      - name: Preflight
        run: python scripts/preflight.py

      - name: Visual Studio solution validation
        run: python scripts/validate_solution.py

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t matchpulse-live:ci .

      - name: Inspect image
        run: |
          docker image inspect matchpulse-live:ci --format '{{.Config.User}} {{json .Config.Healthcheck}}'
          test "$(docker image inspect matchpulse-live:ci --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect matchpulse-live:ci --format '{{.Config.User}}')" != "root"

      # Fail-closed vulnerability gate. Any HIGH or CRITICAL finding fails the
      # build. The gate is never skipped, reordered after a push, or made
      # non-blocking, and it uses no ignore file, no ignore-unfixed mode, no
      # blanket CVE exception and no severity downgrade. The scanner image is
      # pinned by digest so the gate cannot be changed by moving a tag.
      - name: Block on HIGH or CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            "aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222" image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            matchpulse-live:ci

      - name: Compose configuration
        run: docker compose -f compose.challenge.yml config
